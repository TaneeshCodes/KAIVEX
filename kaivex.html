<style>
:root{--g:#E0431F;--hi:#FF6636;--o:#E0431F;--bg:#09090b;--ink:#F4F4F5}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background-color:var(--bg);background-image:radial-gradient(ellipse 80% 50% at 50% -15%,rgba(255,255,255,.03),transparent 75%),radial-gradient(ellipse 60% 40% at 50% 115%,rgba(224,67,31,.02),transparent 70%);color:var(--ink);overflow:hidden;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.frame{background:radial-gradient(65% 45% at 50% 28%,rgba(255,255,255,.02),transparent 75%),radial-gradient(45% 35% at 50% 32%,rgba(224,67,31,.02),transparent 65%);position:absolute;left:50%;top:50%;width:1440px;height:1080px;margin:-540px 0 0 -720px;overflow:hidden;transform:scale(var(--s,1))}
.a{position:absolute;left:calc(var(--x)*1px);top:calc(var(--y)*1px);width:var(--w,auto);z-index:3}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
.top{position:absolute;inset:0 0 auto 0;height:100px;z-index:3}
.logo{display:flex;align-items:center;gap:12px}.logo img{display:block;height:40px;width:auto}.logo img+img{height:15px}
.nav{display:flex;gap:31px;font-size:16.4px;line-height:20px;color:var(--ink);font-weight:400}
.pill{display:flex;align-items:center;justify-content:center;height:40px;border-radius:20px;font-weight:500;font-size:15px}
.login{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:var(--ink);width:92px}
.sign{background:linear-gradient(180deg,#3B7BF2,#1D4FC2);color:#fff;width:97px}
.badge{width:292px;height:37px;border-radius:19px;background:rgba(47,111,232,.16);box-shadow:inset 0 0 0 1px rgba(123,167,255,.3);color:#B5CDFF;gap:9px;white-space:nowrap;font-weight:500;font-size:16.6px;display:flex;align-items:center;justify-content:center}
h1{font:700 88px/92px "Inter Tight",sans-serif;letter-spacing:-.035em;color:var(--ink);text-align:center}
h1 span{display:block}h1 span+span{letter-spacing:-.022em}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--o)}
.sub{text-align:center;font-size:32px;line-height:42px;font-weight:500;letter-spacing:-.02em;color:#D4D4D8;width:1440px;display:flex;justify-content:center;align-items:center}
.rowwrap{position:absolute;left:0;top:0;width:1440px;height:1080px;z-index:1;pointer-events:none}
.host{position:absolute;left:0;top:0;width:1440px;height:1080px;transform-origin:0 0;cursor:grab;touch-action:pan-y}
.host.drag{cursor:grabbing}
.card{position:absolute;overflow:hidden;pointer-events:auto;background:#0c1220;user-select:none;-webkit-user-select:none}
.layer{position:absolute}
.poster{background:url(https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b7ebb74a-8c8a-4f7e-8f80-55e2d74ecd05.webp) 0 0/100% 100% no-repeat}
.vid{object-fit:fill;opacity:0;transition:opacity .5s;pointer-events:none}
.vid.on{opacity:1}
.play{position:absolute;left:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center}
.note{font:600 34px/36px Caveat,cursive;color:var(--hi);white-space:nowrap;transform-origin:0 0}
.ring{width:190px;height:74px;border:2px dashed var(--hi);border-radius:37px;display:grid;place-items:center}
.cta{width:172px;height:58px;border:0;border-radius:29px;background:linear-gradient(180deg,#3B7BF2,#1D4FC2);box-shadow:0 8px 28px rgba(47,111,232,.35);color:#fff;font:500 18px Inter,sans-serif;cursor:pointer}
svg.ink{position:absolute;left:0;top:0;width:1440px;height:1080px;pointer-events:none;z-index:3;fill:none;stroke:var(--hi);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
svg.ink path{stroke-dasharray:1;stroke-dashoffset:0}
#intro{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;transition:opacity 1s ease}
#intro.done{opacity:0;pointer-events:none}
#iv{width:min(100vw,177.78vh);max-height:100vh}
#intro button{position:absolute;bottom:24px;font:500 14px Inter,sans-serif;color:#F0EEEA;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);border:0;border-radius:20px;padding:9px 16px;cursor:pointer}
#intro button:hover{background:rgba(255,255,255,.18)}
#skip{right:24px}#snd{left:24px}
@media(max-width:820px){
  html,body{overflow:auto}
  .frame{position:relative;left:0;top:0;margin:0;width:100%;height:auto;min-height:100%;transform:none;overflow:visible;display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 20px 34px}
  .a{position:static;width:auto}

  <h1 class="a" id="h1" style="--x:0;--y:160;--w:1440px"><span>Your Next Big Thing.</span><span>Our Next Build.</span></h1>

<script>
(()=>{
const SRC='https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/04fd3d5f-99d7-476e-98a4-46c08518ffb3.mp4';
const $=id=>document.getElementById(id);
const frame=$('frame'),host=$('host');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const N=10,PITCH=196,LOOP=N*PITCH,TR=1/0.7111;
let S=1,K=1,R=706,CX=720,CY=687,mobile=false;

function layout(){
  mobile=matchMedia('(max-width:820px)').matches;
  if(!mobile){
    S=Math.min(innerWidth/1440,innerHeight/1080);frame.style.setProperty('--s',S);
    K=1;R=706;CX=720;CY=687;host.style.cssText='';
  }else{
    S=1;K=innerWidth/560;R=innerWidth/2/K;CX=R;CY=125/K;
    host.style.width=innerWidth/K+'px';host.style.height=250/K+'px';host.style.transform='scale('+K+')';
  }
}
addEventListener('resize',layout);layout();

/* cards */
const cards=[],vids=[];
for(let i=0;i<N;i++){
  const c=document.createElement('div');c.className='card';
  const lay=document.createElement('div');lay.className='layer';
  const p=document.createElement('div');p.className='layer poster';
  const v=document.createElement('video');v.className='layer vid';
  v.muted=true;v.loop=true;v.playsInline=true;v.autoplay=true;v.preload='auto';v.setAttribute('muted','');
  if(!reduce){
    v.src=SRC;
    v.addEventListener('loadeddata',()=>{const m=vids[0];if(m&&m!==v&&m.readyState>1)v.currentTime=m.currentTime;v.classList.add('on');v.play().catch(()=>{});});
    vids.push(v);
  }
  const pl=document.createElement('div');pl.className='play';
  pl.innerHTML='<svg width="12" height="14" viewBox="0 0 12 14"><path d="M2 1.5v11l9-5.5z" fill="#fff"/></svg>';
  lay.appendChild(p);lay.appendChild(v);c.appendChild(lay);c.appendChild(pl);host.appendChild(c);
  cards.push({c,lay,pl,col:i%5,row:(i/5)|0});
}
setInterval(()=>{const m=vids[0];if(!m)return;for(const v of vids){const d=Math.abs(v.currentTime-m.currentTime);if(v!==m&&v.readyState>1&&d>.12&&d<4.88)v.currentTime=m.currentTime;}},1500);

/* rounded quad path */
function rq(P,r){
  let d='';
  for(let k=0;k<4;k++){
    const p=P[k],a=P[(k+3)%4],b=P[(k+1)%4];
    const ua=[a[0]-p[0],a[1]-p[1]],ub=[b[0]-p[0],b[1]-p[1]];
    const la=Math.hypot(...ua),lb=Math.hypot(...ub);
    const s=[p[0]+ua[0]/la*r,p[1]+ua[1]/la*r],e=[p[0]+ub[0]/lb*r,p[1]+ub[1]/lb*r];
    d+=(k?'L':'M')+s[0].toFixed(1)+' '+s[1].toFixed(1)+'Q'+p[0].toFixed(1)+' '+p[1].toFixed(1)+' '+e[0].toFixed(1)+' '+e[1].toFixed(1);
  }
  return d+'Z';
}

/* drag + momentum */
let extra=0,vel=0,dragging=false,lx=0,lt=0;
host.addEventListener('pointerdown',e=>{dragging=true;vel=0;lx=e.clientX;lt=performance.now();host.classList.add('drag');});
addEventListener('pointermove',e=>{
  if(!dragging)return;
  const now=performance.now(),dx=(e.clientX-lx)/(S*K),dt=Math.max(now-lt,1)/1000;
  extra+=dx;vel=.6*vel+.4*(dx/dt);lx=e.clientX;lt=now;
});
const up=()=>{if(!dragging)return;dragging=false;host.classList.remove('drag');if(performance.now()-lt>90)vel=0;};
addEventListener('pointerup',up);addEventListener('pointercancel',up);

/* time-based clock */
const clock=document.documentElement.animate([{opacity:1},{opacity:1}],{duration:1e9});
let prev=clock.currentTime;
function tick(){
  const t=clock.currentTime,dt=Math.min((t-prev)/1000,.1);prev=t;
  if(!dragging){extra+=vel*dt;vel*=Math.pow(.05,dt);}
  const off=(reduce?0:-t/1000*50)+extra;
  for(let i=0;i<N;i++){
    const o=cards[i],tt=(((i*PITCH+off)%LOOP)+LOOP)%LOOP-LOOP/2;
    const x=CX+tt*(1+.083*Math.pow(tt/R,2));
    if(Math.abs(x-CX)>R+320){o.c.style.display='none';continue;}
    o.c.style.display='';
    const d=Math.abs(x-CX)/R,w=170+48*d*d,x1=x-w/2,x2=x+w/2;
    const h1=280+92*Math.pow(Math.abs(x1-CX)/R,2.6),h2=280+92*Math.pow(Math.abs(x2-CX)/R,2.6);
    const cy=CY-12*d*d,hb=Math.max(h1,h2),top=cy-hb/2,c0=hb/2;
    o.c.style.cssText='display:;left:'+x1.toFixed(2)+'px;top:'+top.toFixed(2)+'px;width:'+w.toFixed(2)+'px;height:'+hb.toFixed(2)+'px;clip-path:path("'+rq([[0,c0-h1/2],[w,c0-h2/2],[w,c0+h2/2],[0,c0+h1/2]],15)+'")';
    const TH=Math.max(hb,w*TR),TW=TH/TR;
    const L=o.lay.style;L.width=(5*TW).toFixed(1)+'px';L.height=(2*TH).toFixed(1)+'px';
    L.left=((w-TW)/2-o.col*TW).toFixed(1)+'px';L.top=((hb-TH)/2-o.row*TH).toFixed(1)+'px';
    o.pl.style.top=(c0+h1/2-14-34).toFixed(1)+'px';
  }
  requestAnimationFrame(tick);
}
tick();

/* entrance */
function enter(){
  const E='cubic-bezier(.2,.8,.2,1)';
  const go=(el,kf,delay,dur=750)=>el.animate(kf,{duration:dur,delay,easing:E,fill:'backwards'});
  go(document.querySelector('.top'),[{opacity:0,transform:'translateY(-24px)'},{opacity:1,transform:'none'}],0);
  document.querySelectorAll('#h1 span').forEach((s,i)=>go(s,[{opacity:0,transform:'translateY(40px)',filter:'blur(14px)'},{opacity:1,transform:'none',filter:'blur(0)'}],180+i*140,900));
  go($('sub'),[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'none'}],700);
  go($('rowwrap'),[{opacity:0,transform:'translateY(110px)'},{opacity:1,transform:'none'}],550,1100);
  go($('ring'),[{opacity:0,transform:'scale(.7)'},{opacity:1,transform:'none'}],1000,650);
  document.querySelectorAll('svg.ink path').forEach((p,i)=>go(p,[{strokeDashoffset:1},{strokeDashoffset:0}],1200+i*180,700));
  [['n1','rotate(16deg)',1500],['n2','rotate(24deg)',1700]].forEach(([id,r,dl])=>go($(id),[{opacity:0},{opacity:1}],dl,600));
}
const intro=$('intro'),iv=$('iv');let done=false;
function finish(){if(done)return;done=true;intro.classList.add('done');enter();setTimeout(()=>intro.remove(),1100);}
if(reduce){intro.remove();}else{
  iv.addEventListener('ended',finish);$('lastsrc').addEventListener('error',finish);
  iv.addEventListener('timeupdate',()=>{if(iv.duration&&iv.currentTime>iv.duration-.6)finish();});
  iv.play().catch(()=>setTimeout(finish,700));
  setTimeout(finish,7000);
  $('skip').onclick=finish;
  $('snd').onclick=e=>{iv.muted=!iv.muted;e.target.textContent=iv.muted?'Sound on':'Sound off';};
}
})();
</script>
